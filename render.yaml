services:
  - type: web
    name: audemo
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --timeout 120 --workers 1 web_server:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
    disk:
      name: model-storage
      mountPath: /opt/render/project/src
      sizeGB: 1